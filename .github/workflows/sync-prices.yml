name: Sync PriceCatcher prices

on:
  schedule:
    # Every Monday at 06:00 MYT (22:00 UTC Sunday) — after KPDN weekly refresh
    - cron: '0 22 * * 0'
  workflow_dispatch:   # Allow manual trigger from GitHub Actions UI

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to commit prices.json back to the repo

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run PriceCatcher sync
        run: node scripts/sync-prices.mjs

      - name: Commit updated prices.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/prices.json
          git diff --cached --quiet || git commit -m "chore: weekly PriceCatcher price sync $(date -u +%Y-%m-%d)"
          git push
